<header class="site-header">
  <a class="brand" routerLink="/publicaciones" aria-label="FutbolCrack, ir a publicaciones">
    <span class="brand-mark" aria-hidden="true">FC</span>
    <span>FUTBOL<span class="brand-accent">CRACK</span><small>TALENTO EN JUEGO</small></span>
  </a>
  <nav aria-label="Navegación principal">
    <a routerLink="/publicaciones" routerLinkActive="active" ariaCurrentWhenActive="page"
      >Publicaciones</a
    >
    <!-- La señal compartida actualiza los enlaces al ingresar, salir o vencer la sesión. -->
    @if (auth.usuarioActual()) {
      <a routerLink="/mi-perfil" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Mi perfil</a
      >
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Ingresar</a>
      <a
        class="register-link"
        routerLink="/registro"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Registrarse</a
      >
    }
    <!-- Directiva visual reutilizable; la API y el router mantienen sus controles de acceso. -->
<!--
El asterisco aplica la directiva estructural: TemplateRef/ViewContainerRef insertan o retiran enlaces.
Aunque no se vean, los endpoints administrativos siguen necesitando AuthGuard y AdministradorGuard en Nest.
-->    <ng-container *appPermisoRol="'administrador'">
      <a routerLink="/dashboard/usuarios" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Administrar usuarios</a
      >
      <a routerLink="/dashboard/estadisticas" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Estadísticas</a
      >
    </ng-container>
  </nav>
</header>
